<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Статистика словоформ аварского языка">
    <title>Статистика — словоформы avar.me</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☀</text></svg>">
</head>
<body>
    <div class="bg-pattern" aria-hidden="true"></div>

    <div class="container">
        <header class="header">
            <p class="header-tag">avar.me · forms</p>
            <h1 class="title">Статистика<br><span class="dot">словоформ</span></h1>
            <nav class="site-nav">
                <a href="index.html" class="nav-link">Поиск</a>
                <a href="stats.html" class="nav-link nav-link-active">Статистика</a>
            </nav>
        </header>

        <div id="statsLoading" class="loading">
            <div class="spinner"></div>
            <p>Загрузка статистики…</p>
        </div>

        <div id="statsContent" class="stats-page" style="display:none">
            <section class="stats-hero">
                <div class="stat-cards" id="statCards"></div>
            </section>

            <section class="stats-section">
                <h2 class="stats-heading">Источники данных</h2>
                <div class="chart-row">
                    <div class="chart-card">
                        <canvas id="chartSubsources"></canvas>
                    </div>
                    <div class="chart-card">
                        <canvas id="chartCoverage"></canvas>
                    </div>
                </div>
            </section>

            <section class="stats-section">
                <h2 class="stats-heading">Топ лемм</h2>
                <div class="chart-card chart-card-wide">
                    <canvas id="chartTopLemmas"></canvas>
                </div>
            </section>

            <section class="stats-section">
                <h2 class="stats-heading">Типы связей</h2>
                <div class="chart-row">
                    <div class="chart-card chart-card-wide">
                        <canvas id="chartRelations"></canvas>
                    </div>
                </div>
            </section>

            <section class="stats-section">
                <h2 class="stats-heading">Топ словоформ</h2>
                <div class="chart-card chart-card-wide">
                    <canvas id="chartTopWordforms"></canvas>
                </div>
            </section>

            <section class="stats-section">
                <h2 class="stats-heading">Покрытие и пробелы</h2>
                <div id="coverageDetails" class="coverage-grid"></div>
            </section>
        </div>

        <div id="statsError" class="error-message"></div>

        <footer class="footer">
            <p>
                Проект <a href="https://avar.me" target="_blank" rel="noopener">avar.me</a>
                · <a href="https://github.com/avar-me/forms" target="_blank" rel="noopener">github.com/avar-me/forms</a>
            </p>
        </footer>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="stats.js?v=47ae591bd840" charset="utf-8"></script>
</body>
</html>
