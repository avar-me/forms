[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "avarforms"
version = "0.1.0"
description = "Extract and aggregate Avar word forms from multiple corpora"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
avarforms-build = "avarforms.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["avarforms*"]
