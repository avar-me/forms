name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Newer deploys cancel an in-progress one so the queue never hangs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Build docs/data/ from the CURRENT sources (sources.avar.me) on every deploy,
      # so the site is never a stale snapshot. Static docs/ files are committed; the
      # build regenerates docs/data/ (gitignored) and cache-busts the HTML.
      - name: Build site (fetches current sources)
        run: ./build.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
